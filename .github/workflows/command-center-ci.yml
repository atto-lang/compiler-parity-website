name: AttoLang command center source-only verification
on:
  pull_request:
    paths:
      - 'command-center/**'
      - '.github/workflows/command-center-ci.yml'
  push:
    branches: [main]
    paths:
      - 'command-center/**'
      - '.github/workflows/command-center-ci.yml'
permissions:
  contents: read
jobs:
  source-only-command-center:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable proposed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD and root tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SITE_BLOB=$(git rev-parse HEAD:command-center/index.html)"
          test -z "$(git status --porcelain)"
      - name: Execute source-only UI and adversarial metadata checks
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check command-center/tools/evidence-core.mjs
          node --check command-center/tools/github-api.mjs
          node --check command-center/tools/refresh.mjs
          node --check command-center/tools/verify-run.mjs
          node command-center/tests/site-smoke.cjs
          node --test command-center/tests/evidence.test.mjs
          echo 'ATTO_GUEST_COMPILER_EXECUTION=NOT_EXECUTED'
          echo 'TLC_EXECUTION=NOT_EXECUTED'
          echo 'METADATA_VERDICT=SOURCE_ONLY_TESTS'
